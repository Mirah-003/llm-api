services:
  - type: web
    name: llm-triage-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openrouter/free
      - key: LLM_STUB
        value: "0"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_API_KEY
        sync: false
